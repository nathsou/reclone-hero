name: Checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tools/stem-helper -p 'test_*.py'
      - run: npm test
      - run: npm run build
      # Smoke-test the harness; timing thresholds on shared runners would be noisy.
      - run: npm run bench
